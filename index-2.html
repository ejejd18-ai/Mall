<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مسح الباركود</title>
<style>
:root{--g:#0f7a4a;--ink:#12261c;--err:#b3261e}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#f2f6f3;color:var(--ink);font-family:"Segoe UI",Tahoma,system-ui,sans-serif}
main{min-height:100%;max-width:480px;margin:0 auto;padding:20px;display:flex;flex-direction:column;justify-content:center;gap:16px;text-align:center}
#cam{position:relative;aspect-ratio:3/4;border-radius:18px;overflow:hidden;background:#000}
video{width:100%;height:100%;object-fit:cover}
.frame{position:absolute;inset:34% 10%;border:3px solid #fff;border-radius:12px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.tip{position:absolute;bottom:10px;left:0;right:0;margin:0;color:#fff}
#msg{min-height:1.4em;margin:0;font-size:1.05rem}
#msg.err{color:var(--err);font-weight:600}
button{padding:22px;font:inherit;font-size:1.4rem;font-weight:700;color:#fff;background:var(--g);border:0;border-radius:16px}
button:focus-visible,a:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
a{color:var(--g);font-size:1.1rem;font-weight:700}
</style>
</head>
<body>
<main>
  <div id="cam" hidden>
    <video id="video" playsinline muted></video>
    <div class="frame"></div>
    <p class="tip">وجّه الكاميرا إلى الباركود</p>
  </div>
  <p id="msg" role="status"></p>
  <button id="btn" type="button">📷 مسح الباركود</button>
  <a id="link" hidden>فتح صفحة المنتج</a>
</main>
<script>
(function(){var u=["https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js","https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"],i=0;
window.zxReady=new Promise(function(ok){function n(){if(window.ZXing||i>=u.length)return ok();var s=document.createElement("script");s.src=u[i++];s.onload=function(){ok()};s.onerror=n;document.head.appendChild(s)}n()})})();
</script>
<script>
/* قارئ باركود -> يفتح صفحة نظام المول. لا قاعدة بيانات ولا API. */
const MALL_URL = "http://192.168.1.107:2017/SmartMarket/ku/ProductView.jsp?search=";
const FORMATS = ["ean_13", "ean_8", "upc_a", "upc_e", "code_128", "code_39"];
const MSG = {
  camera: "يرجى السماح باستخدام الكاميرا حتى تستطيع مسح الباركود.",
  insecure: "الكاميرا تتطلب رابطًا آمنًا (https). افتح الصفحة عبر الرابط الصحيح.",
  generic: "تعذر تشغيل الكاميرا. حاول مرة أخرى.",
  bad: "الباركود غير مقروء، حاول مرة أخرى.",
};
const $ = id => document.getElementById(id);
const video = $("video"), btn = $("btn"), msg = $("msg"), link = $("link");
let stream = null, timer = null, controls = null, reader = null, done = false;

const say = (t, err) => { msg.textContent = t || ""; msg.className = err ? "err" : ""; };

function stop() {
  clearInterval(timer); timer = null;
  try { controls?.stop(); } catch {}
  try { reader?.reset(); } catch {}
  controls = reader = null;
  stream?.getTracks().forEach(t => t.stop()); stream = null;
  video.srcObject = null;
}

function onCode(raw) {
  if (done) return;
  const code = String(raw || "").trim();
  if (!/^[0-9A-Za-z.\-]{4,32}$/.test(code)) return;   // تجاهل القراءات الغريبة
  done = true; stop();
  const url = MALL_URL + encodeURIComponent(code);
  $("cam").hidden = true; link.href = url; link.hidden = false;
  say("جارٍ فتح صفحة المنتج...");
  window.location.href = url;                          // نفس المتصفح/Safari
}

const constraints = { video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 } }, audio: false };

async function nativeOK() {
  if (!("BarcodeDetector" in window)) return false;
  try { const s = await BarcodeDetector.getSupportedFormats(); return ["ean_13", "ean_8", "upc_a", "upc_e", "code_128"].every(f => s.includes(f)); }
  catch { return false; }
}

async function startNative() {
  stream = await navigator.mediaDevices.getUserMedia(constraints);
  video.srcObject = stream; await video.play();
  const det = new BarcodeDetector({ formats: FORMATS });
  timer = setInterval(async () => {
    if (done || video.readyState < 2) return;
    try { const r = await det.detect(video); if (r.length) onCode(r[0].rawValue); } catch {}
  }, 200);
}

async function startZXing() {
  await window.zxReady;
  if (!window.ZXing) throw new Error("ZXing missing");
  const Z = ZXing, F = Z.BarcodeFormat;
  const hints = new Map();
  hints.set(Z.DecodeHintType.POSSIBLE_FORMATS, [F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E, F.CODE_128, F.CODE_39]);
  hints.set(Z.DecodeHintType.TRY_HARDER, true);
  reader = new Z.BrowserMultiFormatReader(hints, 150);
  controls = await reader.decodeFromConstraints(constraints, video, res => { if (res) onCode(res.getText()); });
}

async function start() {
  done = false; link.hidden = true; say("");
  if (!window.isSecureContext || !navigator.mediaDevices?.getUserMedia) return say(MSG.insecure, true);
  btn.hidden = true; $("cam").hidden = false;
  try { (await nativeOK()) ? await startNative() : await startZXing(); }
  catch (e) {
    stop(); $("cam").hidden = true; btn.hidden = false;
    say(e && (e.name === "NotAllowedError" || e.name === "SecurityError") ? MSG.camera : MSG.generic, true);
    console.error(e);
  }
}

btn.addEventListener("click", start);
document.addEventListener("visibilitychange", () => { if (document.hidden) stop(); });
// عند العودة من صفحة المول (زر الرجوع) يظهر الزر من جديد
window.addEventListener("pageshow", e => { if (e.persisted) { done = false; $("cam").hidden = true; btn.hidden = false; link.hidden = true; say(""); } });
</script>
</body>
</html>
